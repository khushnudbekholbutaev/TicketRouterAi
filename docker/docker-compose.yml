services:
  api:
    build: { context: .., dockerfile: docker/Dockerfile }
    env_file: ../.env
    environment:
      AUTH_USERS_FILE: /app/auth/users.json
    volumes:
      - ../auth:/app/auth:ro
    ports: ["8000:8000"]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:12.1.0
    ports: ["3000:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    command: mlflow server --host 0.0.0.0 --backend-store-uri sqlite:////mlflow/mlflow.db
    volumes: ["../mlflow.db:/mlflow/mlflow.db"]
    ports: ["5000:5000"]
  ui:
    image: nginx:1.27-alpine
    env_file: ../.env
    volumes:
      - ../ui/html:/usr/share/nginx/html:ro
      - ../ui/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports: ["8080:80"]
    depends_on: [api]
    restart: unless-stopped
